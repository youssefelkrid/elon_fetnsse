<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="Élan Fitness" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon badge -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="#FF6B2C"/>
  <!-- Dumbbell tilted upward (élan = momentum) -->
  <g transform="translate(50 50) rotate(-35) scale(0.85) translate(-50 -50)" fill="#FFFFFF">
    <rect x="28" y="46.5" width="44" height="7" rx="3.5"/>
    <rect x="23" y="32" width="9" height="36" rx="3"/>
    <rect x="14" y="38.5" width="8" height="23" rx="3"/>
    <rect x="68" y="32" width="9" height="36" rx="3"/>
    <rect x="78" y="38.5" width="8" height="23" rx="3"/>
  </g>
  <!-- Wordmark -->
  <text x="106" y="62" font-family="Inter, Poppins, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" fill="#0F172A" letter-spacing="-1">Élan Fitness</text>
  <circle cx="395" cy="53" r="6" fill="#FF6B2C"/>
  <!-- Swoosh = forward momentum -->
  <path d="M108 80 Q240 68 392 74 Q240 78 108 80 Z" fill="#FF6B2C"/>
</svg>
